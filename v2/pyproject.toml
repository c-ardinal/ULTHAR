[project]
name = "ulthar"
version = "2.0.0a1"
description = "ULTHAR v2 R1: runtime.db, single hook dispatcher, transcript ingestion, memory and decisions, contracts and the unit process"
requires-python = ">=3.13"  # PurePath.full_match (unit scope globs)
dependencies = ["psutil", "PyYAML"]  # PyYAML: the contract / process CLI only, never a hook

[project.scripts]
ulthar = "ulthar.cli:main"

[tool.setuptools]
packages = ["ulthar", "ulthar.lib", "ulthar.guards"]

[tool.setuptools.package-data]
ulthar = ["config.json", "process/*.yaml"]
